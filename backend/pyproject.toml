[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartdiary"
version = "0.1.0"
description = "Source-grounded, offline-first personal diary"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "pydantic-settings>=2.6,<3", "httpx>=0.28,<1", "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1", "python-multipart>=0.0.20", "cryptography>=44",
  "oss2>=2.19,<3", "beautifulsoup4>=4.12,<5", "Pillow>=11,<13", "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["smartdiary*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["smartdiary", "test_core", "test_media_late_arrival"]
